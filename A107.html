<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 90vh;
        }

        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        .preview-img {
            width: 100%;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 6px;
            object-fit: contain;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 12px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 8px;
            word-wrap: break-word;
            font-size: 13px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message:not(.user) .message-bubble {
            background: #e8e8e8;
            color: #333;
        }

        .table-output {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #ddd;
            overflow-x: auto;
            font-size: 11px;
            font-family: monospace;
        }

        .table-output pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-top: 8px;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-area button {
            padding: 10px 20px;
        }

        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel Izquierdo -->
        <div class="panel">
            <div class="panel-header">📱 Data Input</div>
            <div class="panel-content">
                
                <div class="section">
                    <div class="section-title">🔑 API Configuration</div>
                    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; margin-bottom: 8px;">
                    <button class="btn-primary" style="width: 100%;" onclick="setApiKey()">Save API Key</button>
                    <div id="apiStatus" style="margin-top: 8px; font-size: 12px; color: #718096; display: none;">
                        ✅ API Key configured
                    </div>
                    <div class="info-box" style="margin-top: 10px;">
                        Get your key at:<br/>
                        <a href="https://console.anthropic.com" target="_blank" style="color: #667eea; text-decoration: none;">console.anthropic.com</a>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">📸 Ticket Photo</div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="clickGallery()">🖼️ Gallery</button>
                        <button class="btn-primary" onclick="clickCamera()">📷 Camera</button>
                    </div>
                    <img id="preview" class="preview-img" style="display:none;">
                </div>

                <div class="section">
                    <div class="section-title">🎤 Dictate Expense</div>
                    <button class="btn-primary" style="width: 100%;" id="micBtn" onclick="startRecording()">🎤 Press to Dictate</button>
                    <div id="micStatus" style="margin-top: 10px; color: #667eea; font-weight: 600; display: none;">🔴 Listening...</div>
                </div>

                <div class="section">
                    <div class="section-title">📝 Insert Expense</div>
                    <input type="text" id="commandInput" placeholder="Example: Gasoline 25.50 Fuel">
                    <button class="btn-primary" style="width: 100%;" onclick="sendCommand()">Insert</button>
                    <div class="info-box">
                        <strong>Examples:</strong><br/>
                        • ticket Mercadona 45.99 INV001<br/>
                        • Gasoline 25.50 Fuel<br/>
                        • Pharmacy 15.99 Medicine<br/>
                        • total
                    </div>
                </div>

            </div>
        </div>

        <!-- Panel Derecho -->
        <div class="panel">
            <div class="panel-header">💬 Expense Manager</div>
            <div class="chat-area">
                <div class="messages" id="chatMessages"></div>
                <div class="input-area">
                    <input type="text" id="chatInput" placeholder="Or type here..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button class="btn-primary" onclick="sendChat()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="galleryInput" accept="image/*" style="display:none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

    <script>
        let ticketData = null;
        let additionalExpenses = [];
        let recognition = null;
        let apiKey = localStorage.getItem('anthropic_api_key') || '';
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                document.getElementById('micStatus').style.display = 'block';
                document.getElementById('micBtn').disabled = true;
            };

            recognition.onend = () => {
                document.getElementById('micStatus').style.display = 'none';
                document.getElementById('micBtn').disabled = false;
            };

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                addMessage(transcript, 'user');
                processVoice(transcript);
            };

            recognition.onerror = (event) => {
                let errorMsg = '';
                switch(event.error) {
                    case 'not-allowed':
                        errorMsg = '❌ Permiso denegado. Permite el micrófono en configuración.';
                        break;
                    case 'no-speech':
                        errorMsg = '❌ No se detectó sonido. Intenta de nuevo.';
                        break;
                    default:
                        errorMsg = `❌ Error: ${event.error}`;
                }
                addMessage(errorMsg, 'system');
                document.getElementById('micStatus').style.display = 'none';
                document.getElementById('micBtn').disabled = false;
            };
        }

        function setApiKey() {
            const input = document.getElementById('apiKeyInput');
            const key = input.value.trim();
            
            if (!key) {
                addMessage('❌ Por favor ingresa una API Key', 'system');
                return;
            }
            
            if (key.length < 20) {
                addMessage('❌ La API Key parece ser inválida', 'system');
                return;
            }
            
            apiKey = key;
            localStorage.setItem('anthropic_api_key', key);
            document.getElementById('apiStatus').style.display = 'block';
            input.value = '';
            addMessage('✅ API Key guardada correctamente', 'system');
        }

        async function processImageWithAI(base64Image) {
            if (!apiKey) {
                addMessage('⚠️ API Key no configurada. Usando modo demo.', 'system');
                return processTicketDemo();
            }

            try {
                // Analizar sin mostrar mensaje de carga
                
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-haiku-4-5-20251001',
                        max_tokens: 500,
                        messages: [
                            {
                                role: 'user',
                                content: [
                                    {
                                        type: 'image',
                                        source: {
                                            type: 'base64',
                                            media_type: 'image/jpeg',
                                            data: base64Image.split(',')[1]
                                        }
                                    },
                                    {
                                        type: 'text',
                                        text: 'Analiza esta imagen de ticket. Extrae SOLO los datos visibles en la imagen. Responde en JSON con este formato: {"tienda":"nombre de la tienda (SOLO si está visible)","total":"total a pagar (SOLO si está visible)","codigo":"número de ticket/referencia (SOLO si está visible)","items":[{"nombre":"nombre del producto exacto del ticket","precio":"precio exacto del producto"}]}. IMPORTANTE: Si no puedes leer un campo claramente, NO lo inventes. Si no hay items visibles, devuelve items como array vacío [].'
                                    }
                                ]
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Error');
                }

                const data = await response.json();
                const content = data.content[0].text;
                
                try {
                    const jsonMatch = content.match(/\{[\s\S]*\}/);
                    const result = JSON.parse(jsonMatch ? jsonMatch[0] : content);
                    
                    // Validar que tenga al menos TOTAL para ser válido
                    if (!result.total) {
                        // Sin datos claros, no hacer nada
                        return;
                    }
                    
                    ticketData = {
                        date: new Date().toISOString().split('T')[0],
                        store: result.tienda || 'Tienda',
                        total: parseFloat(result.total) || 0,
                        invoiceCode: result.codigo || 'TKT'
                    };
                    
                    // Mostrar cada item del ticket en el chat (solo los que estén en el ticket)
                    if (result.items && Array.isArray(result.items) && result.items.length > 0) {
                        let itemsMessage = `📦 Items encontrados:\n`;
                        result.items.forEach(item => {
                            if (item.nombre && item.precio) {
                                itemsMessage += `• ${item.nombre}: ${formatPrice(parseFloat(item.precio))}€\n`;
                            }
                        });
                        if (itemsMessage !== `📦 Items encontrados:\n`) {
                            addMessage(itemsMessage, 'assistant');
                        }
                    }
                    
                    let confirmMessage = '';
                    if (result.tienda) confirmMessage += `🏪 Tienda: ${result.tienda}\n`;
                    if (result.total) confirmMessage += `💰 Total: ${formatPrice(parseFloat(result.total))}€\n`;
                    if (result.codigo) confirmMessage += `📄 Código: ${result.codigo}`;
                    
                    if (confirmMessage) {
                        addMessage(confirmMessage, 'assistant');
                    }
                    
                    generateResumenAuto();
                } catch (e) {
                    console.error('Error parsing:', e);
                    // Sin datos válidos, no mostrar nada
                    return;
                }
            } catch (error) {
                console.error('Error API:', error);
                // Si hay error, simplemente no mostrar nada
            }
        }

        function processTicketDemo() {
            const stores = ['Mercadona', 'Carrefour', 'Alcampo', 'Lidl', 'Repsol'];
            const store = stores[Math.floor(Math.random() * stores.length)];
            const total = (Math.random() * 100 + 10).toFixed(2);

            ticketData = {
                date: new Date().toISOString().split('T')[0],
                store,
                total: parseFloat(total),
                invoiceCode: 'TKT' + Math.floor(Math.random() * 100000)
            };

            addMessage(`✅ Ticket (demo): ${store} - ${formatPrice(total)}€`, 'assistant');
            generateResumenAuto();
        }

        function clickGallery() {
            const input = document.getElementById('galleryInput');
            if (!input) {
                console.error('Elemento galleryInput no encontrado');
                addMessage('❌ Error: No se pudo abrir la galería', 'system');
                return;
            }
            input.click();
        }

        function clickCamera() {
            const input = document.getElementById('cameraInput');
            if (!input) {
                console.error('Elemento cameraInput no encontrado');
                addMessage('❌ Error: No se pudo abrir la cámara', 'system');
                return;
            }
            input.click();
        }

        function startRecording() {
            if (!SpeechRecognition) {
                addMessage('❌ Tu navegador NO soporta reconocimiento de voz. Usa Chrome, Edge o Safari reciente.', 'system');
                return;
            }
            
            if (!recognition) {
                addMessage('❌ Inicializando micrófono... intenta de nuevo', 'system');
                return;
            }

            try {
                try {
                    recognition.abort();
                } catch(e) {
                    console.log('No hay sesión anterior para abortar');
                }
                
                setTimeout(() => {
                    recognition.start();
                }, 100);
            } catch (e) {
                console.error('Error al iniciar:', e);
                addMessage(`❌ Error: ${e.message}\n💡 Asegúrate de haber permitido acceso al micrófono en tu navegador.`, 'system');
            }
        }

        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                
                // Si hay API Key, procesar con IA, si no, usar demo
                if (apiKey) {
                    processImageWithAI(e.target.result);
                } else {
                    processTicketDemo();
                }
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('galleryInput').addEventListener('change', handleImage);
        document.getElementById('cameraInput').addEventListener('change', handleImage);

        function processVoice(text) {
            let cleanText = text;
            
            const numberWords = {
                'cero': '0', 'uno': '1', 'dos': '2', 'tres': '3', 'cuatro': '4',
                'cinco': '5', 'seis': '6', 'siete': '7', 'ocho': '8', 'nueve': '9',
                'diez': '10', 'once': '11', 'doce': '12', 'trece': '13', 'catorce': '14',
                'quince': '15', 'dieciséis': '16', 'diecisiete': '17', 'dieciocho': '18',
                'diecinueve': '19', 'veinte': '20', 'veintiuno': '21', 'veintidós': '22',
                'veintitrés': '23', 'veinticuatro': '24', 'veinticinco': '25',
                'veintiséis': '26', 'veintisiete': '27', 'veintiocho': '28', 'veintinueve': '29',
                'treinta': '30', 'cuarenta': '40', 'cincuenta': '50', 'sesenta': '60',
                'setenta': '70', 'ochenta': '80', 'noventa': '90'
            };
            
            Object.keys(numberWords).forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, 'gi');
                cleanText = cleanText.replace(regex, numberWords[word]);
            });
            
            // Reemplazar variaciones de "coma" y "punto"
            cleanText = cleanText.replace(/\s+coma\s+/gi, '.');
            cleanText = cleanText.replace(/\s+punto\s+/gi, '.');
            cleanText = cleanText.replace(/coma/gi, '.');
            cleanText = cleanText.replace(/punto/gi, '.');
            
            console.log('Texto limpio:', cleanText);
            
            // Nuevo formato: Concepto importe [número.número O número] Sección
            // Más flexible con el número (acepta: 25.50, 25,50, 25)
            const match = cleanText.match(/^(.+?)\s+importe\s+([\d]+[\.,]?[\d]*)\s+(.+)$/i);
            
            console.log('Match:', match);
            
            if (match) {
                const concept = match[1].trim();
                const amountStr = match[2].replace(',', '.');
                const amount = parseFloat(amountStr);
                const section = match[3].trim();
                
                console.log(`Concepto: ${concept}, Importe: ${amount}, Sección: ${section}`);
                
                if (!isNaN(amount) && amount > 0) {
                    additionalExpenses.push({
                        date: new Date().toISOString().split('T')[0],
                        concept,
                        amount,
                        section
                    });
                    addMessage(`✅ Gasto: ${concept} - ${formatPrice(amount)}€`, 'assistant');
                    generateResumenAuto();
                } else {
                    addMessage('❌ El importe debe ser un número válido', 'system');
                }
            } else {
                addMessage('❓ No entendí. Dicta: "Gasolina importe 25.50 Combustible"\n💡 Asegúrate de decir "importe" antes del número.', 'assistant');
                console.log('No coincidió el patrón. Texto:', cleanText);
            }
        }

        function sendCommand() {
            const input = document.getElementById('commandInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';
            addMessage(cmd, 'user');
            processCmd(cmd);
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            addMessage(msg, 'user');
            processCmd(msg);
        }

        function processCmd(cmd) {
            const lower = cmd.toLowerCase();

            if (lower.startsWith('ticket ')) {
                const match = cmd.match(/ticket\s+(.+?)\s+([\d,\.]+)\s+(.+)/i);
                if (match) {
                    ticketData = {
                        date: new Date().toISOString().split('T')[0],
                        store: match[1].trim(),
                        total: parseFloat(match[2].replace(',', '.')),
                        invoiceCode: match[3].trim()
                    };
                    addMessage(`✅ Gasto: ${match[1].trim()} - ${formatPrice(match[2])}€`, 'assistant');
                    generateResumenAuto();
                } else {
                    addMessage('❌ Formato: ticket [tienda] [total] [código]', 'system');
                }
            } else {
                processExpense(cmd);
            }
        }

        function processExpense(expenseStr) {
            const lower = expenseStr.toLowerCase();
            
            if (lower === 'resumen' || lower === 'suban' || lower === 'total') {
                generateResumenManual();
            } else if (lower === 'reseteo') {
                ticketData = null;
                additionalExpenses = [];
                document.getElementById('preview').style.display = 'none';
                addMessage('🔄 Resetado', 'system');
            } else {
                const match = expenseStr.match(/^(.+?)\s+([\d]+[,\.]\d+|[\d]+)\s+(.+)$/i);
                
                if (match) {
                    const concept = match[1].trim();
                    const amountStr = match[2].replace(',', '.');
                    const amount = parseFloat(amountStr);
                    const section = match[3].trim();
                    
                    if (!isNaN(amount) && amount > 0) {
                        additionalExpenses.push({
                            date: new Date().toISOString().split('T')[0],
                            concept,
                            amount,
                            section
                        });
                        addMessage(`✅ Gasto: ${concept} - ${formatPrice(amount)}€`, 'assistant');
                        generateResumenAuto();
                    } else {
                        addMessage('❌ El importe debe ser un número válido', 'system');
                    }
                } else {
                    addMessage('📌 Formato incorrecto\n📝 Escribe: [Concepto] [Importe] [Sección]', 'assistant');
                }
            }
        }

        function generateResumenAuto() {
            if (!ticketData && additionalExpenses.length === 0) return;

            let table = '';
            if (ticketData) {
                table += `${ticketData.date}\tSuper\t-${formatPrice(ticketData.total)}\t${ticketData.store}\t0\t${getYearMonth(ticketData.date)}\t${ticketData.store}\t${ticketData.invoiceCode}\t${getMonth(ticketData.date)}\n`;
            }
            additionalExpenses.forEach(exp => {
                table += `${exp.date}\t${exp.concept}\t-${formatPrice(exp.amount)}\t${ticketData?.store || 'Otro'}\t0\t${getYearMonth(exp.date)}\t${exp.section}\t${ticketData?.invoiceCode || 'ADI'}\t${getMonth(exp.date)}\n`;
            });

            const total = (ticketData?.total || 0) + additionalExpenses.reduce((s, e) => s + e.amount, 0);
            showTableExcel(table, total);
        }

        function generateResumenManual() {
            if (!ticketData && additionalExpenses.length === 0) {
                addMessage('❌ Agrega datos primero', 'system');
                return;
            }
            generateResumenAuto();
        }

        function showTableExcel(table, total) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            const tableDiv = document.createElement('div');
            tableDiv.className = 'table-output';
            
            const pre = document.createElement('pre');
            pre.textContent = table;
            tableDiv.appendChild(pre);
            
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = '📋 Copy for Excel';
            btn.onclick = function() {
                const text = pre.textContent;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        btn.textContent = '✅ Copiado';
                        setTimeout(() => btn.textContent = '📋 Copy for Excel', 2000);
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        btn.textContent = '✅ Copiado';
                        setTimeout(() => btn.textContent = '📋 Copy for Excel', 2000);
                    });
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    btn.textContent = '✅ Copiado';
                    setTimeout(() => btn.textContent = '📋 Copy for Excel', 2000);
                }
            };
            tableDiv.appendChild(btn);
            
            const totalDiv = document.createElement('div');
            totalDiv.style.marginTop = '10px';
            totalDiv.style.fontSize = '14px';
            totalDiv.style.fontWeight = 'bold';
            totalDiv.style.color = '#667eea';
            totalDiv.textContent = `💰 TOTAL: -${formatPrice(total)}€`;
            tableDiv.appendChild(totalDiv);
            
            bubble.appendChild(tableDiv);
            msgDiv.appendChild(bubble);
            document.getElementById('chatMessages').appendChild(msgDiv);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function formatPrice(price) {
            return parseFloat(price).toFixed(2).replace('.', ',');
        }

        function getYearMonth(date) {
            const d = new Date(date);
            return (d.getFullYear() * 100 + d.getMonth() + 1).toString();
        }

        function getMonth(date) {
            const d = new Date(date);
            return (d.getMonth() + 1).toString();
        }

        function addMessage(text, type = 'assistant') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type === 'user' ? 'user' : ''}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            msgDiv.appendChild(bubble);
            document.getElementById('chatMessages').appendChild(msgDiv);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        window.addEventListener('load', () => {
            addMessage('¡Hola! Sube foto, dicta o escribe un gasto.', 'assistant');
            
            // Mostrar si hay API Key guardada
            if (apiKey) {
                document.getElementById('apiStatus').style.display = 'block';
            }
        });
    </script>
</body>
</html>
